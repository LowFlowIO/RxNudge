; RxNudge for Seeed reTerminal Sticky (ESP32-S3R8, SSD1677 800x480, GT911)
; env:sticky reuses the hardware settings of LowFlowIO/sticky-micronotes (platformio.ini:4-57)
; env:native builds src/core only and runs Unity tests on the host.

[platformio]
default_envs = sticky

[env:sticky]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino, espidf

board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.f_flash = 40000000L
; Seeed documents 32 MB flash; we keep the reference's 16 MB image so the
; CrossPoint partition table (and its web flasher) stays valid. 16 MB is a
; strict subset of the 32 MB part.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; qio_opi makes the ROM die in ets_loader.c before the 2nd-stage bootloader (reference quirk).
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi

build_unflags =
  -std=gnu++11
  -Werror=int-in-bool-context
  -Werror
  -Werror=format-truncation
  -Werror=format

build_flags =
  -Wno-error
  -Wno-format-truncation
  -Wno-error=format-truncation
  -Wno-error=format
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DCORE_DEBUG_LEVEL=0
  -DRETERMINAL_STICKY=1
  -DRXNUDGE_LOG=1
  -I lib/hal
  -I src
  -std=gnu++17

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_protocol = esptool
upload_speed = 460800

extra_scripts =
  pre:scripts/pio_nowerror.py
  pre:scripts/pio_version.py
  post:scripts/pio_sha256.py

lib_deps =
  greiman/SdFat@2.3.1
  FS
  LittleFS

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/> +<storage/> +<ui_core/> +<app_core/> +<net_core/> -<storage/sd_selftest.cpp> -<storage/arduino_fs.cpp>
build_flags = -std=gnu++17 -I src -Wall
